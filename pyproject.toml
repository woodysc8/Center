[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "center"
version = "0.1.0"
description = "Center delegation package"
readme = "README (1).md"
requires-python = ">=3.10"

dependencies = []

[tool.setuptools]
packages = ["center", "specialists", "capabilities"]
py-modules = [
  "ceo",
  "classifier",
  "config",
  "delegation",
  "intake",
  "juan_whey",
  "richard",
  "view_tasks",
  "execution",
]
